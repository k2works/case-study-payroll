version: '2'
services:
  app:
    build: .
    ports:
     - "3000:3000"
    volumes:
     - .:/code

  mkdocs:
    build:
      context: .
      dockerfile: ./docs/Dockerfile
    environment:
      PLANTUML_SERVER_URL: http://plantuml:8080/plantuml
    volumes:
      - ./docs:/docs/docs
      - ./README.md:/docs/README.md
    ports:
      - "8000:8000"
    command: mkdocs serve --dev-addr=0.0.0.0:8000
    links:
      - plantuml

  plantuml:
    image: plantuml/plantuml-server:jetty
    environment:
      BASE_URL: plantuml